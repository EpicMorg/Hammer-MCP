name: release

# Push a tag like v0.1.0-alpha to build hammer-mcp.exe and publish a GitHub release
# (tags with a "-" suffix are marked as pre-release).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Test
        working-directory: src
        run: dotnet test --solution HammerMcp.sln -c Release
      - name: Native injectors and adapters (MSVC)
        # picked up by HammerMcp.App.csproj from build/native-{Win32,x64}/Release into native\ next to hammer-mcp.exe
        shell: pwsh
        run: |
          foreach ($arch in "Win32", "x64") {
            cmake -S src/native -B build/native-$arch -A $arch
            cmake --build build/native-$arch --config Release
          }
      - name: Publish single-file exe (win-x64 and win-x86, same layout)
        working-directory: src
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          foreach ($rid in "win-x64", "win-x86") {
            dotnet publish src/HammerMcp.App/HammerMcp.App.csproj -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none -p:Version=$version -o ../publish-$rid
            # hammer-mcp-cli.exe: the same server without the tray app (MCP over stdio for clients that launch it)
            dotnet publish src/HammerMcp.Cli/HammerMcp.Cli.csproj -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none -p:Version=$version -o ../publish-$rid
            # both bitnesses of the injector + adapter: an x86 app injects into an x64 Hammer through hmcp-injector64.exe
            $n = (Get-ChildItem ../publish-$rid/native -Filter "hmcp-*").Count
            if ($n -lt 4) { throw "${rid}: native\ has $n files, expected 2 injectors + 2 adapters" }
          }
      - name: Package
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-x86") {
            Copy-Item README.md, README.ru.md, CHANGELOG.md, CHANGELOG.ru.md, LICENSE, THIRD-PARTY-NOTICES.md publish-$rid/
            Compress-Archive -Path publish-$rid/* -DestinationPath "hammer-mcp-${{ github.ref_name }}-$rid.zip"
          }
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @(); if ("${{ github.ref_name }}".Contains("-")) { $extra += "--prerelease" }
          # release notes = this version's section of CHANGELOG.md, plus GitHub's generated list
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notes = @(); $in = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[(.+?)\]') { $in = ($Matches[1] -eq $version); continue }
            if ($line -match '^\[.+\]: ') { continue }
            if ($in) { $notes += $line }
          }
          Set-Content release-notes.md ($notes -join "`n").Trim()
          gh release create "${{ github.ref_name }}" "hammer-mcp-${{ github.ref_name }}-win-x64.zip" "hammer-mcp-${{ github.ref_name }}-win-x86.zip" `
            --title "Hammer-MCP ${{ github.ref_name }}" --notes-file release-notes.md --generate-notes @extra
