name: release

# Push a tag like v0.1.0-alpha to build hammer-mcp.exe and publish a GitHub release
# (tags with a "-" suffix are marked as pre-release).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Test
        working-directory: src
        run: dotnet test --solution HammerMcp.sln -c Release
      - name: Publish single-file exe
        working-directory: src
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/HammerMcp.App/HammerMcp.App.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=$version -o ../publish
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, README.ru.md, CHANGELOG.md, CHANGELOG.ru.md, LICENSE, THIRD-PARTY-NOTICES.md publish/
          Compress-Archive -Path publish/* -DestinationPath "hammer-mcp-${{ github.ref_name }}-win-x64.zip"
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @(); if ("${{ github.ref_name }}".Contains("-")) { $extra += "--prerelease" }
          # release notes = this version's section of CHANGELOG.md, plus GitHub's generated list
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notes = @(); $in = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[(.+?)\]') { $in = ($Matches[1] -eq $version); continue }
            if ($line -match '^\[.+\]: ') { continue }
            if ($in) { $notes += $line }
          }
          Set-Content release-notes.md ($notes -join "`n").Trim()
          gh release create "${{ github.ref_name }}" "hammer-mcp-${{ github.ref_name }}-win-x64.zip" `
            --title "Hammer-MCP ${{ github.ref_name }}" --notes-file release-notes.md --generate-notes @extra
