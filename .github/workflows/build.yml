name: build

on:
  push:
    branches: [develop, master, 'feature/**']
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Native (for the app's native\ folder)
        working-directory: .
        shell: pwsh
        run: |
          foreach ($arch in "Win32", "x64") {
            cmake -S src/native -B build/native-$arch -A $arch
            cmake --build build/native-$arch --config Release
          }
      - name: Build
        run: dotnet build HammerMcp.sln -c Release
      - name: Publish check (native\ next to the single-file exe)
        shell: pwsh
        run: |
          dotnet publish src/HammerMcp.App/HammerMcp.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ../publish-check
          $n = (Get-ChildItem ../publish-check/native -Filter "hmcp-*").Count
          if ($n -lt 6) { throw "native\ in the publish folder has $n files, expected injectors + adapters" }
          Get-ChildItem ../publish-check/native | Format-Table Name, Length
      - name: Test
        run: dotnet test --solution HammerMcp.sln -c Release --no-build

  native:
    # reference build of the injector and adapters with MSVC (Linux builds them with clang-cl + xwin)
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S src/native -B build/native-${{ matrix.arch }} -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build/native-${{ matrix.arch }} --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: |
            build/native-${{ matrix.arch }}/Release/*.exe
            build/native-${{ matrix.arch }}/Release/*.dll
